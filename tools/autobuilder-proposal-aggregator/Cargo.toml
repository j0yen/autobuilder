[package]
name = "autobuilder-proposal-aggregator"
version = "0.1.0"
edition = "2021"

[lib]
name = "autobuilder_proposal_aggregator"
path = "src/lib.rs"

[[bin]]
name = "autobuilder-proposal-aggregator"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
