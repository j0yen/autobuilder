[package]
name = "autobuilder-bincov-receipt"
version = "0.1.0"
edition = "2021"
description = "Detects [[bin]] crates with no integration test; emits a bincov.v1 receipt"

[[bin]]
name = "autobuilder-bincov-receipt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
