# proof-lanes.toml — change-class → required-lane routing for the
# autobuilder repo. Globs are relative to the git repo root (which is
# what `git diff --name-only` emits), so the `autobuilder/` workspace
# prefix is included.

[[lane]]
id = "autobuilder-rust"
description = "Behavior changes in the autobuilder binary, plus its integration tests (autobuilder/tests/**) — previously unrouted, first surfaced when the rollback-mechanical-chains series added tests/chain_ac*.rs and tests/mergerev_ac*.rs (PRD-autobuilder-gate-debt)"
globs = ["autobuilder/src/**/*.rs", "autobuilder/tests/**/*.rs", "autobuilder/tests/fixtures/**"]
required_commands = [
  "cd autobuilder && cargo check --workspace",
  "cd autobuilder && cargo clippy --bin autobuilder -- -D warnings",
  "cd autobuilder && cargo test --workspace",
]

[[lane]]
id = "extended-gates-rust"
description = "Behavior changes in the vendored extended-gates crate (17 receipt-producer bins under src/bin/** dispatching to src/producers/**, plus src/lib.rs and its acceptance tests), plus its own extended-gates.toml config — previously unrouted, surfaced when the v0.7.1 extended-gates 0.1.1 port (commit 54ab8f7) added new producer/bin source files absent from proof-lanes.toml, dropping vti-plan's routing confidence, and again when this PRD added autobuilder/extended-gates.toml for the secrets-scan allowlist (PRD-autobuilder-gate-debt, mirroring rustbuild's identical lane)"
globs = [
  "autobuilder/crates/extended-gates/src/**/*.rs",
  "autobuilder/crates/extended-gates/tests/**/*.rs",
  "autobuilder/extended-gates.toml",
]
required_commands = [
  "cd autobuilder && cargo check --workspace",
  "cd autobuilder && cargo test -p autobuilder-extended-gates",
]

[[lane]]
id = "gate-rust"
description = "Behavior changes in the dogfooded autobuilder-gate crate (src/lib.rs, acceptance/hermetic-scope/rollback-tag tests) — previously unrouted, surfaced alongside the extended-gates gap during the v0.7.1 port (PRD-autobuilder-gate-debt)"
globs = [
  "autobuilder/crates/gate/src/**/*.rs",
  "autobuilder/crates/gate/tests/**/*.rs",
]
required_commands = [
  "cd autobuilder && cargo check --workspace",
  "cd autobuilder && cargo test -p autobuilder-gate",
]

[[lane]]
id = "receipt-rust"
description = "Behavior changes in the dogfooded receipt crate (atomic write-verify-rename helper the receipt writers in crates/gate and crates/extended-gates share) — previously unrouted, first surfaced when PRD-autobuilder-receipt-write-verify added crates/receipt/src/lib.rs as a new workspace member"
globs = [
  "autobuilder/crates/receipt/src/**/*.rs",
  "autobuilder/crates/receipt/tests/**/*.rs",
]
required_commands = [
  "cd autobuilder && cargo check --workspace",
  "cd autobuilder && cargo test -p autobuilder-receipt",
]

[[lane]]
id = "metric-harness-rust"
description = "Behavior changes in the dogfooded metric-harness crate"
globs = ["autobuilder/crates/metric-harness/src/**/*.rs"]
required_commands = [
  "cd autobuilder && cargo check --workspace",
  "cd autobuilder && cargo test -p autobuilder-metric-harness",
]

[[lane]]
id = "rust-deps"
description = "Cargo.toml / Cargo.lock changes for the autobuilder workspace"
globs = [
  "autobuilder/Cargo.toml",
  "autobuilder/Cargo.lock",
  "autobuilder/crates/*/Cargo.toml",
]
required_commands = [
  "cd autobuilder && cargo check --workspace",
  "cd autobuilder && cargo deny check",
]

[[lane]]
id = "ci"
description = "GitHub Actions workflow changes"
globs = [".github/workflows/**"]
required_commands = [
  "gh run list -R j0yen/autobuilder --commit HEAD --json conclusion",
]

[[lane]]
id = "agent"
description = "Intent-card / proof-lanes / owner-map / test-map changes, including the autobuilder/agent -> ../agent symlink autobuilder's own binary reads when --project resolves to autobuilder/ (PRD-build-extend-gate-nested-crate-project)"
globs = ["agent/**", "autobuilder/agent"]
required_commands = [
  "autobuilder vti-plan --project . --base origin/main",
]

[[lane]]
id = "harness"
description = "scripts/ — the per-project shell harness, plus rules/ — vendored risk-gate rule scripts scripts/audit.sh sources (onboard-repo.sh's risk-gate wiring, PRD-build-gate-producers), including the autobuilder/scripts -> ../scripts symlink autobuilder's own binary reads when --project resolves to autobuilder/ (PRD-autobuilder-gate-debt, mirroring PRD-build-extend-gate-nested-crate-project's autobuilder/agent symlink)"
globs = ["scripts/**", "rules/**", "autobuilder/scripts"]
required_commands = [
  "bash scripts/run-metrics.sh",
]

[[lane]]
id = "docs"
description = "Markdown docs and PRDs, including the autobuilder/PRD-*.md copy ac-traceability's source scan reads at the nested Cargo project root (PRD-autobuilder-gate-debt)"
globs = ["*.md", "PLAN.md", "PRD-*.md", "autobuilder/PRD-*.md"]
required_commands = []

[[lane]]
id = "skill"
description = "Vendored Claude Code skill (prompts, rules, schemas, scripts, templates, SKILL.md)"
globs = [
  "skill/**",
  "skill/SKILL.md",
]
required_commands = [
  "bash skill/install.sh",
]

[[lane]]
id = "config"
description = "Top-level repo + workspace config (lints, deny, toolchain pins)"
globs = [
  ".gitignore",
  ".gitattributes",
  "autobuilder/.gitignore",
  "autobuilder/clippy.toml",
  "autobuilder/deny.toml",
  "autobuilder/rust-toolchain.toml",
  "autobuilder/crates/*/clippy.toml",
  "autobuilder/crates/*/deny.toml",
  "autobuilder/crates/*/rust-toolchain.toml",
  "autobuilder/crates/*/.gitignore",
  "autobuilder/crates/*/Cargo.lock",
]
required_commands = [
  "cd autobuilder && cargo check --workspace",
]

[[lane]]
id = "metric-harness-scaffold"
description = "Scaffolded support files of the metric-harness crate (tests, agent, scripts, ci)"
globs = [
  "autobuilder/crates/metric-harness/tests/**",
  "autobuilder/crates/metric-harness/agent/**",
  "autobuilder/crates/metric-harness/scripts/**",
  "autobuilder/crates/metric-harness/.github/**",
]
required_commands = [
  "cd autobuilder && cargo test -p autobuilder-metric-harness",
]
