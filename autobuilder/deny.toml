# deny.toml — supply-chain policy for the autobuilder companion binary.

[graph]
targets = []

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path deps (session-trace-receipt, autobuilder-receipt,
# autobuilder-gate, autobuilder-evolve-safety, ...) are pinned to the exact
# workspace commit by construction; they don't need a version constraint
# the way an external "*" dependency would. PRD-fleet-ci-green.
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "prefer rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
