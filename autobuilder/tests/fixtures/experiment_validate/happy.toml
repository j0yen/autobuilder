schema = "autobuilder.experiment_manifest.v1"

[campaign]
slug = "happy-fixture"
prd_source = "PRD.md"
max_wall_clock_minutes = 60
max_total_iterations = 16

[edit_agent]
model = "claude-opus-4-7"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens_per_call = 16000
fallback_to_signal_mode = false

[[slices]]
id = "S1"
intent_card = "intent-card.json"
max_iterations = 4
transition = "advance-commit"

[[slices]]
id = "S2"
intent_card = "intent-card.json"
max_iterations = 4
transition = "advance-commit"
