[workspace]
members = [".", "crates/edit-agent", "crates/evolve-safety", "crates/extended-gates", "crates/gate", "crates/metric-harness", "crates/receipt", "crates/session-trace"]
exclude = ["crates"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Joey Yen <jyen.tech@gmail.com>"]
repository = "https://github.com/j0yen/autobuilder"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "deny"
indexing_slicing = "warn"
mem_forget = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[package]
name = "autobuilder"
version = "0.2.0"
description = "PRD-driven, rigorously validated Rust code generation: companion binary for the autobuilder Claude Code skill."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "autobuilder"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
globset = "0.4"
regex = "1"
session-trace-receipt = { path = "crates/session-trace" }
autobuilder-receipt = { path = "crates/receipt" }
autobuilder-gate = { path = "crates/gate" }
autobuilder-evolve-safety = { path = "crates/evolve-safety" }

[dev-dependencies]
tempfile = "3"
